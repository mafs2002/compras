<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compras</title>
<meta name="apple-mobile-web-app-title" content="Compras">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f8f5b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#faf8f4;--card:#fff;--text:#222;--muted:#8a8a8a;--accent:#2f8f5b;--line:#e8e4dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181a19;--card:#232625;--text:#eee;--muted:#8d9490;--accent:#4fc486;--line:#333836}}
:root[data-theme="dark"]{--bg:#181a19;--card:#232625;--text:#eee;--muted:#8d9490;--accent:#4fc486;--line:#333836}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub button{font-size:12px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:4px 8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 8px;margin:0 -16px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tab.new{color:var(--accent);border:1px dashed var(--accent);background:none}
.add{display:flex;flex-direction:column;align-items:stretch;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2}
.add .r{display:flex;gap:8px;align-items:center}
.add input[type=text]{flex:1;min-width:0;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
.add button{font-size:16px;padding:0 16px;height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
.add button.cam{background:var(--card);color:var(--text);border:1px solid var(--line);padding:0;width:46px;font-size:20px;position:relative;overflow:hidden;flex:none}
.add button.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tot{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:6px}
.tot b{font-size:16px}
.tot small{display:block;color:var(--muted);font-size:11px}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
li .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
li span{flex:1;font-size:16px;word-break:break-word;cursor:pointer}
li.done span,li.done .thumb{opacity:.5}
li.done span{text-decoration:line-through;color:var(--muted)}
li .x{border:0;background:none;color:var(--muted);font-size:20px;padding:0 4px}
li .p{font-size:14px;color:var(--text);flex:none;white-space:nowrap;border:0;background:none;padding:6px 4px}
li .p.empty{color:var(--accent);border:1px dashed var(--accent);border-radius:8px;padding:4px 10px;font-weight:600}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 4px;display:flex;justify-content:space-between;align-items:center}
h2 button{font-size:12px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:4px 8px;text-transform:none;letter-spacing:0}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
#login[hidden]{display:none}
#login .lb{width:100%;max-width:340px;text-align:center}
#login h2{display:block;font-size:22px;text-transform:none;letter-spacing:0;color:var(--text);margin:0 0 6px}
#login p{color:var(--muted);font-size:14px;margin:0 0 16px}
#login input{width:100%;font-size:16px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
#login button{width:100%;height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
#lerr{color:#d64545;font-size:13px;min-height:18px;margin-top:10px}
.msg{text-align:center;color:var(--muted);padding:24px 0;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:16px;max-width:420px;width:100%;text-align:center}
.box img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--line)}
.box h3{margin:0 0 12px;font-size:20px;word-break:break-word}
.box .none{padding:36px 0;color:var(--muted);font-size:14px}
.box .row{display:flex;gap:8px;margin-top:14px}
.box .row button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font-size:15px}
.box .row button.p{background:var(--accent);border-color:var(--accent);color:#fff}
.box .row button.d{color:#d64545;border-color:#d64545}
.box .pw{display:flex;gap:8px;justify-content:center;margin-top:12px}
.box .pw label{font-size:12px;color:var(--muted);text-align:left;display:block}
.box input.in,.box .pw input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.box .pw input{text-align:right}
.box .lt{margin-top:8px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>🛒 Listas de Compras</h1>
  <div class="sub"><span id="status">A ligar…</span><span><button id="editList" hidden>✏️ Editar lista</button> <button id="logout" hidden>Sair</button></span></div>
  <div class="tabs" id="tabs"></div>
  <div class="add">
    <div class="r">
      <button class="cam" id="camBtn" aria-label="Anexar foto">📷</button>
      <input id="inp" type="text" placeholder="Adicionar item…" autocomplete="off" enterkeyhint="done">
      <button id="addBtn">+</button>
    </div>
  </div>
  <div class="tot"><div><small>Total no carrinho</small><b id="tCart">0,00 €</b></div></div>
  <input id="file" type="file" accept="image/*" hidden>
  <ul id="todo"></ul>
  <div id="empty" class="msg" hidden>Lista vazia. Adiciona o primeiro item!</div>
  <h2 id="doneHead" hidden><span>No carrinho</span><button id="clear">Limpar</button></h2>
  <ul id="done"></ul>
</main>
<div id="login" hidden><div class="lb">
  <h2>🛒 Lista de Compras</h2><p>Entra com a tua conta.</p>
  <input id="lemail" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">
  <input id="lpass" type="password" placeholder="Palavra-passe" autocomplete="current-password">
  <button id="lbtn">Entrar</button><div id="lerr"></div>
</div></div>
<div id="modal" hidden><div class="box" id="box"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

(function(){
  var items=[], lists=[], cur=null, pending=null, fileMode='new', modalId=null, defaultMade=false;
  var $=function(id){return document.getElementById(id)};
  var statusEl=$('status');
  try{ cur=localStorage.getItem('listaAtual'); }catch(e){}

  function parsePrice(v){ var n=parseFloat(String(v).replace(',','.').replace(/[^0-9.]/g,'')); return isFinite(n)&&n>=0?Math.round(n*100)/100:null; }
  function parseQty(v){ var n=parseFloat(String(v).replace(',','.')); return isFinite(n)&&n>0?Math.round(n*1000)/1000:1; }
  function fmtQ(n){ return String(n).replace('.',','); }
  function eur(n){ return n.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
  function mine(){ return items.filter(function(i){return i.listId===cur}); }

  function resize(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){
        var max=640, s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        var q=0.72, d=c.toDataURL('image/jpeg',q);
        while(d.length>180000 && q>0.3){ q-=0.1; d=c.toDataURL('image/jpeg',q); }
        res(d);
      };
      im.onerror=function(){ URL.revokeObjectURL(url); rej(); };
      im.src=url;
    });
  }

  function renderTabs(){
    var t=$('tabs'); t.textContent='';
    lists.forEach(function(l){
      var b=document.createElement('button'); b.className='tab'+(l.id===cur?' on':''); b.textContent=l.name;
      b.onclick=function(){ setCur(l.id); };
      t.appendChild(b);
    });
    var n=document.createElement('button'); n.className='tab new'; n.textContent='+ Nova lista';
    n.onclick=function(){ openListModal(null); };
    t.appendChild(n);
    $('editList').hidden = !cur;
  }
  function setCur(id){ cur=id; try{localStorage.setItem('listaAtual',id)}catch(e){} render(); }

  function render(){
    renderTabs();
    var list=mine();
    var todo=list.filter(function(i){return !i.done}), done=list.filter(function(i){return i.done});
    fill($('todo'),todo); fill($('done'),done);
    $('empty').hidden = !cur || todo.length>0 || done.length>0;
    $('doneHead').hidden = done.length===0;
    var cart=0; list.forEach(function(i){ if(i.done&&i.price!=null) cart+=i.price*i.qty; });
    $('tCart').textContent=eur(cart);
    if(modalId&&!$('modal').hidden) openModal(modalId);
  }
  function fill(ul,list){
    ul.textContent='';
    list.forEach(function(it){
      var li=document.createElement('li'); if(it.done) li.className='done';
      var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=it.done;
      cb.onchange=function(){ upd('items',it.id,{done:cb.checked}).catch(err); };
      li.appendChild(cb);
      if(it.img){ var im=document.createElement('img'); im.className='thumb'; im.src=it.img; im.onclick=function(){openModal(it.id)}; li.appendChild(im); }
      var sp=document.createElement('span'); sp.textContent=(it.qty!==1?fmtQ(it.qty)+'× ':'')+it.text; sp.onclick=function(){openModal(it.id)};
      var x=document.createElement('button'); x.className='x'; x.textContent='×'; x.setAttribute('aria-label','Apagar');
      x.onclick=function(){ del_('items',it.id).catch(err); };
      li.appendChild(sp);
      var pp=document.createElement('button'); pp.className='p';
      if(it.price!=null){ pp.textContent=(it.qty!==1?fmtQ(it.qty)+' × '+eur(it.price)+' = ':'')+eur(it.price*it.qty); }
      else { pp.textContent='+ €'; pp.classList.add('empty'); pp.setAttribute('aria-label','Adicionar quantidade e preço'); }
      pp.onclick=function(){ openModal(it.id,true); };
      li.appendChild(pp);
      li.appendChild(x); ul.appendChild(li);
    });
  }

  function openModal(id,focusPrice){
    var it=items.filter(function(i){return i.id===id})[0];
    if(!it){ closeModal(); return; }
    modalId=id;
    var box=$('box'); box.textContent='';
    var h=document.createElement('h3'); h.textContent=it.text; box.appendChild(h);
    if(it.img){ var im=document.createElement('img'); im.src=it.img; box.appendChild(im); }
    else { var n=document.createElement('div'); n.className='none'; n.textContent='Sem foto'; box.appendChild(n); }
    var pw=document.createElement('div'); pw.className='pw';
    function fld(lbl,val,ph,fn){ var w=document.createElement('div'); var l=document.createElement('label'); l.textContent=lbl; var inp=document.createElement('input'); inp.type='text'; inp.inputMode='decimal'; inp.placeholder=ph; inp.value=val; inp.onchange=function(){fn(inp.value)}; w.appendChild(l); w.appendChild(inp); pw.appendChild(w); }
    fld('Quantidade',it.qty!==1?fmtQ(it.qty):'','1',function(v){ upd('items',it.id,{qty:parseQty(v)}).catch(err); });
    fld('Preço unitário €',it.price!=null?String(it.price).replace('.',','):'','0,00',function(v){ var n=parsePrice(v); if(v.trim()===''){ upd('items',it.id,{price:null}).catch(err); } else if(n!=null){ upd('items',it.id,{price:n}).catch(err); } });
    box.appendChild(pw);
    var fi=pw.querySelectorAll('input')[1];
    if(it.price!=null){ var lt=document.createElement('div'); lt.className='lt'; lt.textContent='Total: '+eur(it.price*it.qty); box.appendChild(lt); }
    var row=document.createElement('div'); row.className='row';
    var b1=document.createElement('button'); b1.textContent=it.img?'📷 Trocar foto':'📷 Adicionar foto';
    b1.onclick=function(){ fileMode='edit'; $('file').click(); };
    var b2=document.createElement('button'); b2.className='p'; b2.textContent='Fechar'; b2.onclick=closeModal;
    row.appendChild(b1); row.appendChild(b2); box.appendChild(row);
    $('modal').hidden=false;
    if(focusPrice&&fi) setTimeout(function(){fi.focus()},50);
  }
  function closeModal(){ $('modal').hidden=true; modalId=null; }
  $('modal').onclick=function(e){ if(e.target===$('modal')) closeModal(); };

  function openListModal(id){
    modalId=null;
    var l=id?lists.filter(function(x){return x.id===id})[0]:null;
    var box=$('box'); box.textContent='';
    var h=document.createElement('h3'); h.textContent=l?'Editar lista':'Nova lista'; box.appendChild(h);
    var inp=document.createElement('input'); inp.type='text'; inp.className='in'; inp.placeholder='Nome (ex.: Supermercado, Talho…)'; inp.value=l?l.name:''; inp.maxLength=40;
    box.appendChild(inp);
    var row=document.createElement('div'); row.className='row';
    var save=document.createElement('button'); save.className='p'; save.textContent='Guardar';
    function doSave(){
      var v=inp.value.trim(); if(!v) return;
      if(l){ upd('lists',l.id,{name:v}).catch(err); closeModal(); }
      else { addDoc(collection(db,'lists'),{name:v,ts:Date.now()}).then(function(ref){ setCur(ref.id); }).catch(err); closeModal(); }
    }
    save.onclick=doSave;
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') doSave(); });
    var close=document.createElement('button'); close.textContent='Cancelar'; close.onclick=closeModal;
    row.appendChild(close); row.appendChild(save); box.appendChild(row);
    if(l && lists.length>1){
      var r2=document.createElement('div'); r2.className='row';
      var del=document.createElement('button'); del.className='d'; del.textContent='🗑 Apagar lista';
      del.onclick=function(){
        if(del.dataset.s!=='1'){ del.dataset.s='1'; del.textContent='Confirmar: apagar lista e itens'; return; }
        items.filter(function(i){return i.listId===l.id}).forEach(function(i){ del_('items',i.id).catch(err); });
        del_('lists',l.id).catch(err); closeModal();
      };
      r2.appendChild(del); box.appendChild(r2);
    }
    $('modal').hidden=false;
    setTimeout(function(){ inp.focus(); },50);
  }
  $('editList').onclick=function(){ if(cur) openListModal(cur); };

  function err(e){ statusEl.textContent = (e&&e.code==='permission-denied') ? 'Sem permissão: esta conta não tem acesso (verifica as regras do Firestore).' : 'Erro de ligação, tenta de novo.'; }

  $('camBtn').onclick=function(){ if(pending){ pending=null; setCam(); } else { fileMode='new'; $('file').click(); } };
  $('file').onchange=function(){
    var f=this.files&&this.files[0]; this.value=''; if(!f) return;
    resize(f).then(function(d){
      if(fileMode==='edit' && modalId){ upd('items',modalId,{img:d}).catch(err); }
      else { pending=d; setCam(); }
    }).catch(function(){ statusEl.textContent='Não foi possível ler a imagem.'; });
  };
  function setCam(){
    var b=$('camBtn'); b.textContent='';
    if(pending){ var im=document.createElement('img'); im.src=pending; b.appendChild(im); b.setAttribute('aria-label','Remover foto'); }
    else { b.textContent='📷'; b.setAttribute('aria-label','Anexar foto'); }
  }

  function add(){
    var v=$('inp').value.trim(); if(!v||!cur) return;
    var data={text:v,done:false,ts:Date.now(),listId:cur}; if(pending) data.img=pending;
    $('inp').value=''; pending=null; setCam();
    addDoc(collection(db,'items'),data).catch(err);
  }
  $('addBtn').onclick=add;
  $('inp').addEventListener('keydown',function(e){ if(e.key==='Enter') add(); });
  $('clear').onclick=function(){
    mine().filter(function(i){return i.done}).forEach(function(i){ del_('items',i.id).catch(err); });
  };

  function upd(c,id,data){ return updateDoc(doc(db,c,id),data); }
  function del_(c,id){ return deleteDoc(doc(db,c,id)); }

  var started=false;
  function start(){
  if(started) return; started=true;
  onSnapshot(collection(db,'lists'),{includeMetadataChanges:true},function(snap){
    lists=snap.docs.map(function(d){var x=d.data()||{}; return {id:d.id,name:String(x.name||'Lista'),ts:x.ts||0};})
                   .sort(function(a,b){return a.ts-b.ts});
    if(lists.length===0 && !snap.metadata.fromCache && !defaultMade){
      defaultMade=true; setDoc(doc(db,'lists','default'),{name:'Compras',ts:0}).catch(err);
    }
    if(!lists.some(function(l){return l.id===cur})) cur=lists.length?lists[0].id:null;
    statusEl.textContent=snap.metadata.fromCache?'A sincronizar… (ou sem ligação)':'Sincronizado em tempo real';
    render();
  },function(e){ err(e); });
  onSnapshot(collection(db,'items'),{includeMetadataChanges:true},function(snap){
    items=snap.docs.map(function(d){var x=d.data()||{}; return {id:d.id,listId:(typeof x.listId==='string'&&x.listId)?x.listId:'default',text:String(x.text||''),done:!!x.done,ts:x.ts||0,qty:(typeof x.qty==='number'&&x.qty>0)?x.qty:1,price:(typeof x.price==='number'&&isFinite(x.price))?x.price:null,img:(typeof x.img==='string'&&x.img.indexOf('data:image/')===0)?x.img:''};})
                   .sort(function(a,b){return a.ts-b.ts});
    render();
  },function(e){ err(e); });
  }

  var loginEl=$('login'), le=$('lemail'), lp=$('lpass'), lerr=$('lerr');
  function doLogin(){
    lerr.textContent='';
    signInWithEmailAndPassword(auth,le.value.trim(),lp.value).catch(function(e){
      var c=e&&e.code;
      lerr.textContent=(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email')?'Email ou palavra-passe incorretos.':'Não foi possível entrar. Tenta de novo.';
    });
  }
  $('lbtn').onclick=doLogin;
  lp.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
  $('logout').onclick=function(){ signOut(auth).then(function(){ location.reload(); }); };
  onAuthStateChanged(auth,function(u){
    if(u){ loginEl.hidden=true; $('logout').hidden=false; start(); }
    else { loginEl.hidden=false; $('logout').hidden=true; statusEl.textContent='Inicia sessão'; }
  });
})();

</script>
</body>
</html>
